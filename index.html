<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Podcasts</title>

<style>
/* ==========================================================
   1. BASICS  (colors live here, tweak them if you want)
   ========================================================== */
:root{
  --bg:#121212; --card:#1f1f1f; --hover:#2a2a2a;
  --text:#fff;  --muted:#b3b3b3; --accent:#1ed760;
  --bar:72px;
  --tint:#333;               /* the player screen color, JS changes it per category */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;fill:currentColor}

/* ==========================================================
   2. HOME  (categories + episode tiles)
   ========================================================== */
#home{height:calc(100% - var(--bar));overflow-y:auto;padding:0 28px 40px}
header{position:sticky;top:0;z-index:5;padding:20px 0 14px;background:linear-gradient(var(--bg) 80%,transparent)}
header h1{font-size:1.6rem;margin-bottom:14px}

.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;background:var(--card);white-space:nowrap;transition:background .2s}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--accent);color:#000;font-weight:600}

section{margin-top:28px}
section h2{display:flex;align-items:baseline;gap:10px;font-size:1.3rem;margin-bottom:14px}
section h2 small{font-size:.85rem;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}

.card{background:var(--card);border-radius:8px;padding:14px;cursor:pointer;transition:background .2s}
.card:hover,.card.playing{background:var(--hover)}
.card h3{font-size:1rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:.85rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* cover = gradient + emoji, and the real image sits on top once it exists */
.cover{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;display:grid;place-items:center;font-size:3rem;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.card .cover{margin-bottom:12px}

/* the green play circle. flex + svg = triangle is dead center now */
.badge{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#000;
  display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.badge svg{width:24px;height:24px}
.card:hover .badge,.card.playing .badge{opacity:1;transform:none}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* ==========================================================
   3. BOTTOM BAR  (the little player)
   ========================================================== */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);z-index:10;background:#000;
  display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:12px;padding:0 16px}
.now{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.mini{width:48px;height:48px;border-radius:4px;flex:none;font-size:1.5rem}
.info{min-width:0}
.info b,.info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:.8rem;color:var(--muted)}

.ctr{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;align-items:center;gap:14px}
.ib{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color .15s,transform .15s}
.ib:hover{color:#fff}
.ib svg{width:24px;height:24px}
.ib.skip{font-size:.8rem;font-weight:600;width:44px}
.ib.big{width:46px;height:46px;background:#fff;color:#000}   /* the main play/pause button */
.ib.big:hover{transform:scale(1.06);color:#000}
.ib.big svg{width:28px;height:28px}

.seekrow{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;font-size:.75rem;color:var(--muted)}
.seekrow span{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;height:4px;accent-color:var(--accent);cursor:pointer}

.right{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.speed{font-size:.85rem;border:1px solid #666;border-radius:999px;padding:4px 12px;min-width:52px}
.mPlay,.miniProg{display:none}   /* phone-only stuff, see media query at the bottom */

/* ==========================================================
   4. PLAYER SCREEN  (full screen, with the transcript)
   ========================================================== */
#player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  background:linear-gradient(var(--tint),#121212 120%);
  transform:translateY(100%);visibility:hidden;transition:transform .35s ease,visibility 0s .35s}
#player.open{transform:none;visibility:visible;transition:transform .35s ease}

.ptop{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 8px}
.ptop .from{font-size:.85rem;text-align:center;color:#ddd}
.ptop .ib{color:#fff}
.ptop .ghost{width:38px}

.tabs{display:none;gap:8px;justify-content:center;padding:6px 0}
.tabs button{padding:6px 18px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.9rem}
.tabs button.on{background:#fff;color:#000;font-weight:600}

.pbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:56px;padding:12px 56px 32px;max-width:1300px;width:100%;margin:0 auto}
.pleft{display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0}
.pleft .cover{width:100%;max-width:380px;margin:0 auto;font-size:6rem;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.ptitle{font-size:1.6rem;font-weight:700;line-height:1.2}
.pcat{color:#ddd;font-size:.95rem;margin-top:4px}
.pdesc{color:#ccc;font-size:.9rem;margin-top:6px}
.credits{background:rgba(0,0,0,.25);border-radius:8px;padding:12px 14px}
.credits h4{font-size:.9rem;margin-bottom:4px}
.credits p{color:#ddd;font-size:.9rem;line-height:1.45}
.pleft .seekrow{max-width:none;color:#ddd}
.pleft .btns{justify-content:center;gap:18px}
.pleft .ib{color:#ddd}
.pleft .ib.big{color:#000}

/* ----- the transcript, lyrics style ----- */
.pright{min-height:0;position:relative}
#lyrics{position:absolute;inset:0;overflow-y:auto;padding:38vh 0;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
#lyrics::-webkit-scrollbar{display:none}
#lyrics .line{display:block;width:100%;text-align:left;font-size:clamp(1.5rem,2.6vw,2.2rem);font-weight:800;line-height:1.25;
  padding:10px 0;color:rgba(255,255,255,.38);transform-origin:left center;transition:color .3s,transform .3s}
#lyrics .line:hover{color:rgba(255,255,255,.7)}
#lyrics .line.now{color:#fff;transform:scale(1.03)}
#lyrics .line.past{color:rgba(255,255,255,.5)}
#lyrics .msg{font-size:1.2rem;font-weight:600;color:rgba(255,255,255,.7);text-align:center;padding:0 20px}

#toast{position:fixed;left:50%;bottom:calc(var(--bar) + 16px);transform:translateX(-50%);z-index:50;background:#fff;color:#000;
  padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90%}
#toast.show{opacity:1}

/* ==========================================================
   5. PHONES AND SMALL SCREENS
   ========================================================== */
@media (max-width:860px){
  #home{padding:0 16px 24px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .badge{opacity:.95;transform:none;width:38px;height:38px}   /* no hover on phones, so always show it */

  /* bar becomes a slim spotify-like mini player */
  #bar{grid-template-columns:1fr auto;padding:0 12px env(safe-area-inset-bottom,0);height:calc(var(--bar) + env(safe-area-inset-bottom,0))}
  .ctr,.right{display:none}
  .mPlay{display:flex;color:#000;background:#fff;width:42px;height:42px}
  .miniProg{display:block;position:absolute;left:0;top:0;height:2px;width:0;background:var(--accent)}

  /* player: one thing at a time, switch with the tabs */
  .tabs{display:flex}
  .pbody{grid-template-columns:1fr;padding:8px 22px 24px;gap:0}
  .pleft{justify-content:flex-start;overflow-y:auto}
  #player[data-view="listen"] .pright{display:none}
  #player[data-view="text"] .pleft{display:none}
  #lyrics{padding:30vh 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<body>

<!-- ============ HOME ============ -->
<div id="home">
  <header>
    <h1>Site title</h1>
    <nav class="chips" id="chips" aria-label="Categories"></nav>
  </header>
  <div id="lists"></div>
</div>

<!-- ============ BOTTOM BAR ============ -->
<div id="bar">
  <div class="miniProg" id="miniProg"></div>

  <div class="now" id="openPlayer">
    <div class="cover mini" id="mCover">🎧</div>
    <div class="info"><b id="mTitle">Nothing playing</b><span id="mCat">Pick an episode</span></div>
  </div>

  <div class="ctr">
    <div class="btns">
      <button class="ib skip" data-act="back" aria-label="Back 15 seconds">−15</button>
      <button class="ib" data-act="prev" data-ic="prev" aria-label="Previous"></button>
      <button class="ib big" data-act="toggle" data-ic="play" aria-label="Play or pause"></button>
      <button class="ib" data-act="next" data-ic="next" aria-label="Next"></button>
      <button class="ib skip" data-act="fwd" aria-label="Forward 15 seconds">+15</button>
    </div>
    <div class="seekrow"><span class="tcur">0:00</span><input type="range" class="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek"><span class="tdur">0:00</span></div>
  </div>

  <div class="right">
    <button class="speed" data-act="speed">1x</button>
    <button class="ib" id="expand" data-ic="expand" aria-label="Open player"></button>
  </div>

  <button class="ib big mPlay" data-act="toggle" data-ic="play" aria-label="Play or pause"></button>
</div>

<!-- ============ PLAYER SCREEN ============ -->
<div id="player" data-view="listen" aria-label="Player">
  <div class="ptop">
    <button class="ib" id="closePlayer" data-ic="down" aria-label="Close player"></button>
    <div class="from" id="pFrom">Now playing</div>
    <div class="ghost"></div>
  </div>

  <div class="tabs">
    <button class="on" data-view="listen">Listen</button>
    <button data-view="text">Transcript</button>
  </div>

  <div class="pbody">
    <div class="pleft">
      <div class="cover" id="pCover">🎧</div>
      <div>
        <div class="ptitle" id="pTitle">Select an episode</div>
        <div class="pcat" id="pCat"></div>
        <div class="pdesc" id="pDesc"></div>
      </div>
      <div class="credits"><h4>Produced by</h4><p id="pLearners">Learner names will appear here.</p></div>
      <div>
        <div class="seekrow"><span class="tcur">0:00</span><input type="range" class="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek"><span class="tdur">0:00</span></div>
        <div class="btns">
          <button class="ib skip" data-act="back" aria-label="Back 15 seconds">−15</button>
          <button class="ib" data-act="prev" data-ic="prev" aria-label="Previous"></button>
          <button class="ib big" data-act="toggle" data-ic="play" aria-label="Play or pause"></button>
          <button class="ib" data-act="next" data-ic="next" aria-label="Next"></button>
          <button class="ib skip" data-act="fwd" aria-label="Forward 15 seconds">+15</button>
        </div>
        <div style="text-align:center;margin-top:10px"><button class="speed" data-act="speed">1x</button></div>
      </div>
    </div>

    <div class="pright"><div id="lyrics"></div></div>
  </div>
</div>

<div id="toast"></div>


<script>
/* ==========================================================
   A. CATEGORIES
   Here buddy: emoji, name and color of each category.
   The color tints the player screen for that category.
   ========================================================== */
const CATEGORIES = {
  test:      { emoji:"🧪", label:"Test",        color:"#5a3a8a" },   // temporary, delete this line (and the test episode) when you're done
  glaciers:  { emoji:"🧊", label:"Glaciers",    color:"#1e5a7a" },
  beaches:   { emoji:"🏖️", label:"Beaches",     color:"#a06a1c" },
  mangroves: { emoji:"🌿", label:"Mangroves",   color:"#2d6a3e" },
  forests:   { emoji:"🌲", label:"Forests",     color:"#1f5a3a" },
  coral:     { emoji:"🪸", label:"Coral reefs", color:"#a8445a" }
};

/* ==========================================================
   B. EPISODES
   This is the part you'll actually edit. One line = one podcast.
   Put the files in the covers / audio / transcripts folders.
   Leave learners empty until you're ready, the site handles it.
   ========================================================== */
const EPISODES = [
  // test (temporary, remove when you're done testing)
  { cat:"test", title:"Test podcast", desc:"Just checking how everything looks", learners:"I CAN'T POSSIBLY PUT IN WORDS HOW HAPPY I AM THIS ACTUALLY WORKED, HEY STEVE, DORA, MORI, JENNY, LIVIA, ITS ALIVE!!! I DID IT!!!", cover:"covers/testcover.png", audio:"audio/testaudio.mp3", vtt:"transcripts/testaudio.vtt" },
  // glaciers (5)
  { cat:"glaciers",  title:"Episode title", desc:"Short description", learners:"", cover:"covers/glaciers-1.jpg",  audio:"audio/glaciers-1.mp3",  vtt:"transcripts/glaciers-1.vtt" },
  { cat:"glaciers",  title:"Episode title", desc:"Short description", learners:"", cover:"covers/glaciers-2.jpg",  audio:"audio/glaciers-2.mp3",  vtt:"transcripts/glaciers-2.vtt" },
  { cat:"glaciers",  title:"Episode title", desc:"Short description", learners:"", cover:"covers/glaciers-3.jpg",  audio:"audio/glaciers-3.mp3",  vtt:"transcripts/glaciers-3.vtt" },
  { cat:"glaciers",  title:"Episode title", desc:"Short description", learners:"", cover:"covers/glaciers-4.jpg",  audio:"audio/glaciers-4.mp3",  vtt:"transcripts/glaciers-4.vtt" },
  { cat:"glaciers",  title:"Episode title", desc:"Short description", learners:"", cover:"covers/glaciers-5.jpg",  audio:"audio/glaciers-5.mp3",  vtt:"transcripts/glaciers-5.vtt" },
  // forests (3)
  { cat:"forests",   title:"Episode title", desc:"Short description", learners:"", cover:"covers/forests-1.jpg",   audio:"audio/forests-1.mp3",   vtt:"transcripts/forests-1.vtt" },
  { cat:"forests",   title:"Episode title", desc:"Short description", learners:"", cover:"covers/forests-2.jpg",   audio:"audio/forests-2.mp3",   vtt:"transcripts/forests-2.vtt" },
  { cat:"forests",   title:"Episode title", desc:"Short description", learners:"", cover:"covers/forests-3.jpg",   audio:"audio/forests-3.mp3",   vtt:"transcripts/forests-3.vtt" },
  // beaches (2)
  { cat:"beaches",   title:"Episode title", desc:"Short description", learners:"", cover:"covers/beaches-1.jpg",   audio:"audio/beaches-1.mp3",   vtt:"transcripts/beaches-1.vtt" },
  { cat:"beaches",   title:"Episode title", desc:"Short description", learners:"", cover:"covers/beaches-2.jpg",   audio:"audio/beaches-2.mp3",   vtt:"transcripts/beaches-2.vtt" },
  // coral reefs (2)
  { cat:"coral",     title:"Episode title", desc:"Short description", learners:"", cover:"covers/coral-1.jpg",     audio:"audio/coral-1.mp3",     vtt:"transcripts/coral-1.vtt" },
  { cat:"coral",     title:"Episode title", desc:"Short description", learners:"", cover:"covers/coral-2.jpg",     audio:"audio/coral-2.mp3",     vtt:"transcripts/coral-2.vtt" },
  // mangroves (1)
  { cat:"mangroves", title:"Episode title", desc:"Short description", learners:"", cover:"covers/mangroves-1.jpg", audio:"audio/mangroves-1.mp3", vtt:"transcripts/mangroves-1.vtt" }
];

/* Open the full player screen when someone taps an episode?
   true = yes, false = only the little bar at the bottom shows up */
const OPEN_PLAYER_ON_CLICK = true;


/* ==========================================================
   C. EVERYTHING BELOW IS THE ENGINE
   Don't touch unless you're feeling brave :)
   ========================================================== */

/* ---------- little helpers ---------- */
const $  = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* icons, all svg so they stay centered on every phone and browser */
const ICONS = {
  play:   '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:  '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  prev:   '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>',
  next:   '<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>',
  down:   '<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>',
  expand: '<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM20 20h-6v-2h4v-4h2z"/></svg>'
};
const setIcon = (el, name) => el.innerHTML = ICONS[name];
$$("[data-ic]").forEach(el => setIcon(el, el.dataset.ic));

/* ---------- state (what's happening right now) ---------- */
const audio = new Audio();      // lives outside the page on purpose, so there's no native "download" menu
audio.preload = "metadata";

let current = -1;               // index of the episode that's loaded
let filter = "all";             // which category chip is selected
let lines = [];                 // transcript lines: [{t: seconds, text: "..."}]
let activeLine = -1;            // which line is lit up
let userScrolledAt = 0;         // so we don't fight the person while they scroll the transcript
const SPEEDS = [1, 1.25, 1.5, 0.75];
let speedI = 0;

/* cover = gradient + emoji, real image goes on top. if the image is missing it just removes itself */
const coverHTML = e => `<span>${CATEGORIES[e.cat].emoji}</span><img src="${e.cover}" alt="" draggable="false" onerror="this.remove()">`;
const gradient  = cat => `linear-gradient(135deg, ${CATEGORIES[cat].color}, #222)`;

function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove("show"), 3500);
}


/* ---------- HOME: chips + tiles ---------- */
function renderChips(){
  const items = [["all", "🎧", "All"], ...Object.entries(CATEGORIES).map(([k, v]) => [k, v.emoji, v.label])];
  $("#chips").innerHTML = items.map(([k, em, label]) =>
    `<button class="chip ${filter === k ? "on" : ""}" data-k="${k}">${em} ${label}</button>`).join("");

  $$(".chip").forEach(b => b.onclick = () => {
    filter = b.dataset.k;
    renderChips(); renderTiles();
    $("#home").scrollTo(0, 0);
  });
}

function renderTiles(){
  const keys = filter === "all" ? Object.keys(CATEGORIES) : [filter];

  $("#lists").innerHTML = keys.map(k => {
    const eps = EPISODES.map((e, i) => ({ e, i })).filter(x => x.e.cat === k);
    if (!eps.length) return "";
    const c = CATEGORIES[k];

    return `<section>
      <h2>${c.emoji} ${c.label} <small>${eps.length} ${eps.length > 1 ? "episodes" : "episode"}</small></h2>
      <div class="grid">${eps.map(({ e, i }) => `
        <div class="card ${i === current ? "playing" : ""}" tabindex="0" role="button" data-i="${i}" aria-label="${esc(e.title)}">
          <div class="cover" style="background:${gradient(k)}">${coverHTML(e)}<div class="badge">${ICONS.play}</div></div>
          <h3>${esc(e.title)}</h3>
          <p>${esc(e.desc)}</p>
        </div>`).join("")}
      </div>
    </section>`;
  }).join("");

  $$(".card").forEach(card => {
    const go = () => load(+card.dataset.i, true, OPEN_PLAYER_ON_CLICK);
    card.onclick = go;
    card.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); go(); } };
  });
}


/* ---------- LOADING AN EPISODE ---------- */
function load(i, play, openScreen){
  if (i < 0 || i >= EPISODES.length) return;
  current = i;
  const e = EPISODES[i], c = CATEGORIES[e.cat];

  // audio
  audio.src = e.audio;
  audio.playbackRate = SPEEDS[speedI];

  // bottom bar + player screen texts and covers
  $("#mCover").style.background = $("#pCover").style.background = gradient(e.cat);
  $("#mCover").innerHTML = $("#pCover").innerHTML = coverHTML(e);
  $("#mTitle").textContent = $("#pTitle").textContent = e.title;
  $("#mCat").textContent   = $("#pCat").textContent   = `${c.emoji} ${c.label}`;
  $("#pFrom").textContent  = `Playing from ${c.label}`;
  $("#pDesc").textContent  = e.desc;
  $("#pLearners").textContent = e.learners || "Learner names will appear here.";
  document.documentElement.style.setProperty("--tint", c.color);
  $$(".card").forEach(x => x.classList.toggle("playing", +x.dataset.i === i));

  loadTranscript(e);

  if (play) audio.play().catch(err => {
    // only the "browser wants a tap first" case is handled here, real file problems are caught by audio.onerror below
    if (err.name === "NotAllowedError") toast("Press the play button to start");
  });
  if (openScreen) openPlayer();
}


/* ---------- TRANSCRIPT (spotify lyrics style) ---------- */
async function loadTranscript(e){
  lines = []; activeLine = -1;
  $("#lyrics").innerHTML = '<p class="msg">Loading transcript…</p>';

  try{
    const res = await fetch(e.vtt);
    if (!res.ok) throw new Error("no file");
    lines = parseVTT(await res.text());
    if (!lines.length) throw new Error("empty file");

    $("#lyrics").innerHTML = lines.map((l, k) => `<button class="line" data-k="${k}">${esc(l.text)}</button>`).join("");
    $$("#lyrics .line").forEach(b => b.onclick = () => {          // tap a line = jump to it
      audio.currentTime = lines[+b.dataset.k].t;
      userScrolledAt = 0;
      audio.play().catch(() => {});
    });
  } catch (_){
    $("#lyrics").innerHTML = '<p class="msg">Transcript coming soon.</p>';
  }
}

/* reads a .vtt file and gives back [{t, text}] */
function parseVTT(raw){
  const out = [];
  raw.replace(/\r/g, "").split(/\n\s*\n/).forEach(block => {
    const rows = block.split("\n");
    const k = rows.findIndex(r => r.includes("-->"));
    if (k < 0) return;                                             // header or junk, skip it

    const m = rows[k].match(/([\d:.,]+)\s*-->/);
    if (!m) return;
    const p = m[1].replace(",", ".").split(":").map(parseFloat);   // works for 00:01.5 and 00:00:01.5
    const t = p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];

    const text = rows.slice(k + 1).join(" ").replace(/<[^>]+>/g, "").trim();
    if (text) out.push({ t, text });
  });
  return out;
}

/* light up the right line and scroll it to the middle */
function syncTranscript(){
  if (!lines.length) return;

  let idx = -1;
  for (let k = 0; k < lines.length; k++){
    if (lines[k].t <= audio.currentTime + 0.15) idx = k; else break;
  }
  if (idx === activeLine) return;
  activeLine = idx;

  $$("#lyrics .line").forEach((el, k) => el.className = "line" + (k === idx ? " now" : k < idx ? " past" : ""));
  centerLine();
}

function centerLine(force){
  if (!force && Date.now() - userScrolledAt < 3000) return;        // person is scrolling, leave them alone
  const box = $("#lyrics"), el = $("#lyrics .line.now");
  if (!el || !box.clientHeight) return;                            // hidden tab = no height = nothing to do
  box.scrollTo({ top: el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2, behavior: "smooth" });
}
["wheel", "touchmove"].forEach(ev => $("#lyrics").addEventListener(ev, () => userScrolledAt = Date.now(), { passive:true }));


/* ---------- PLAYER SCREEN open / close / tabs ---------- */
function openPlayer(){
  if (current < 0) return;                                         // nothing picked yet
  $("#player").classList.add("open");
  setTimeout(() => centerLine(true), 380);
}
const closePlayer = () => $("#player").classList.remove("open");

$("#openPlayer").onclick = openPlayer;
$("#expand").onclick = openPlayer;
$("#closePlayer").onclick = closePlayer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });

$$(".tabs button").forEach(b => b.onclick = () => {
  $("#player").dataset.view = b.dataset.view;
  $$(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  if (b.dataset.view === "text") setTimeout(() => centerLine(true), 50);
});


/* ---------- BUTTONS (bar and player share these) ---------- */
const actions = {
  toggle: () => { if (current < 0) return load(0, true, OPEN_PLAYER_ON_CLICK); audio.paused ? audio.play().catch(() => {}) : audio.pause(); },
  prev:   () => load(Math.max(0, current - 1), true),
  next:   () => load(current + 1, true),
  back:   () => audio.currentTime = Math.max(0, audio.currentTime - 15),
  fwd:    () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15),
  speed:  () => {
    speedI = (speedI + 1) % SPEEDS.length;
    audio.playbackRate = SPEEDS[speedI];
    $$(".speed").forEach(b => b.textContent = SPEEDS[speedI] + "x");
  }
};
$$("[data-act]").forEach(b => b.onclick = () => actions[b.dataset.act]());

$$(".seek").forEach(r => r.oninput = () => {
  if (audio.duration) audio.currentTime = r.value / 100 * audio.duration;
});


/* ---------- AUDIO EVENTS ---------- */
audio.onplay  = () => $$('[data-act="toggle"]').forEach(b => setIcon(b, "pause"));
audio.onpause = () => $$('[data-act="toggle"]').forEach(b => setIcon(b, "play"));
// here buddy: this tells you what's REALLY wrong with the audio file instead of guessing
audio.onerror = () => {
  const path = EPISODES[current] ? EPISODES[current].audio : "";
  const code = audio.error ? audio.error.code : 0;
  if (code === 4) toast("Can't open " + path + ". Wrong name or folder, not uploaded yet, or not a real mp3.");
  else if (code === 3) toast("The audio file seems damaged: " + path);
  else if (code === 2) toast("Network problem loading " + path + ". Try again.");
};
audio.onended = () => { if (current < EPISODES.length - 1) load(current + 1, true); };   // autoplay next one
audio.onloadedmetadata = () => $$(".tdur").forEach(s => s.textContent = fmt(audio.duration));
audio.ontimeupdate = () => {
  const pct = audio.duration ? audio.currentTime / audio.duration * 100 : 0;
  $$(".tcur").forEach(s => s.textContent = fmt(audio.currentTime));
  $$(".seek").forEach(r => r.value = pct);
  $("#miniProg").style.width = pct + "%";
  syncTranscript();
};


/* ---------- extras: lock screen controls + "no saving" stuff ---------- */
if ("mediaSession" in navigator){
  const ms = navigator.mediaSession;
  ms.setActionHandler("play",  () => audio.play());
  ms.setActionHandler("pause", () => audio.pause());
  ms.setActionHandler("previoustrack", actions.prev);
  ms.setActionHandler("nexttrack", actions.next);
}
// honest note: this only stops casual saving, not someone who really knows what they're doing
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart",   e => e.preventDefault());


/* ---------- GO! ---------- */
renderChips();
renderTiles();
</script>
